services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: propertyhub_prod
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - path: .env.prod
        required: false
      - path: .env
        required: false
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://propertyhub:propertyhub_secure_password@db:5432/propertyhub_db}
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  db:
    image: postgres:16-alpine
    container_name: propertyhub_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-propertyhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-propertyhub_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-propertyhub_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-propertyhub} -d ${POSTGRES_DB:-propertyhub_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  postgres_prod_data:

