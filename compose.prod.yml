services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: propertyhub_prod
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - path: .env.prod
        required: false
      - path: .env
        required: false
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
