services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: propertyhub_dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://propertyhub:propertyhub_password@db:5432/propertyhub_db
      - PYTHONUNBUFFERED=1
    env_file:
      - path: .env
        required: false
    volumes:
      - .:/app
      - /app/.venv
    develop:
      watch:
        - action: rebuild
          path: ./pyproject.toml
        - action: rebuild
          path: ./uv.lock
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: propertyhub_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: propertyhub
      POSTGRES_PASSWORD: propertyhub_password
      POSTGRES_DB: propertyhub_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U propertyhub -d propertyhub_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
